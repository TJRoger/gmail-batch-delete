{% extends "base.html" %}

{% block title %}Gmail 邮件批量删除工具{% endblock %}

{% block content %}
<div class="dashboard">
    <div class="user-status" id="user-status">
        <div class="loading">正在检查授权状态...</div>
    </div>

    <div class="search-panel">
        <h2>邮件搜索与删除</h2>

        <form id="search-form" class="filter-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="subject">主题包含:</label>
                    <input type="text" id="subject" name="subject" placeholder="例如: ruanyf/weekly"
                        value="ruanyf/weekly">
                </div>

                <div class="form-group">
                    <label for="from">发件人:</label>
                    <input type="text" id="from" name="from" placeholder="例如: example@gmail.com">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="to">收件人:</label>
                    <input type="text" id="to" name="to" placeholder="例如: me@gmail.com">
                </div>

                <div class="form-group">
                    <label for="keyword">关键词（全文搜索）:</label>
                    <input type="text" id="keyword" name="keyword" placeholder="搜索邮件内容">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="after-date">日期范围 - 开始:</label>
                    <input type="date" id="after-date" name="after_date">
                </div>

                <div class="form-group">
                    <label for="before-date">日期范围 - 结束:</label>
                    <input type="date" id="before-date" name="before_date">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="label">标签:</label>
                    <input type="text" id="label" name="label" placeholder="例如: INBOX, SPAM">
                </div>

                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="has-attachment" name="has_attachment">
                        包含附件
                    </label>
                    <label>
                        <input type="checkbox" id="is-read" name="is_read">
                        已读
                    </label>
                    <label>
                        <input type="checkbox" id="is-starred" name="is_starred">
                        已加星标
                    </label>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">搜索邮件</button>
                <button type="button" class="btn btn-secondary" id="clear-btn">清空条件</button>
            </div>
        </form>
    </div>

    <div class="results-panel" id="results-panel" style="display: none;">
        <h3>搜索结果</h3>
        <div class="results-info" id="results-info"></div>
        <div class="results-actions">
            <button class="btn btn-danger" id="delete-btn">删除所有匹配的邮件</button>
            <button class="btn btn-secondary" id="preview-btn">预览邮件列表</button>
        </div>
        <div id="preview-list" class="preview-list"></div>
    </div>

    <div class="progress-panel" id="progress-panel" style="display: none;">
        <h3>删除进度</h3>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-text" id="progress-text"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/index.js') }}"></script>
{% endblock %}
